<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur</title>
<style>
  :root{
    --bg:#0d0d0f;
    --panel:#161618;
    --panel-hover:#1f1f22;
    --text:#f2f1ee;
    --sub:#8f8d92;
    --accent:#ff3d6e;
    --accent-dim:#5c1f34;
    --line:#232326;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    padding:22px 32px 14px 32px;
    display:flex;
    align-items:baseline;
    gap:14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .topbar h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .topbar .count{
    color:var(--sub);
    font-size:13px;
  }

  /* ---------- Main layout ---------- */
  .main{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* Now playing panel */
  .stage{
    width:340px;
    flex-shrink:0;
    padding:36px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    border-right:1px solid var(--line);
    overflow-y:auto;
  }
  .art-wrap{
    width:100%;
    aspect-ratio:1/1;
    border-radius:6px;
    overflow:hidden;
    background:#1a1a1c;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.7);
    position:relative;
  }
  .art-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:opacity .25s ease;
  }
  .art-wrap.spin img{
    animation: none;
  }

  .track-meta{
    width:100%;
    margin-top:26px;
    text-align:left;
  }
  .track-meta .title{
    font-size:21px;
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:1.25;
    word-break:break-word;
  }
  .track-meta .artist{
    margin-top:6px;
    font-size:14px;
    color:var(--sub);
  }
  .track-meta .album{
    margin-top:2px;
    font-size:12.5px;
    color:#5f5d63;
  }

  /* ---------- Playlist ---------- */
  .playlist{
    flex:1;
    overflow-y:auto;
    padding:10px 12px 120px 12px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
  }
  .row:hover{background:var(--panel-hover);}
  .row.active{background:var(--accent-dim);}
  .row .idx{
    width:22px;
    text-align:center;
    color:var(--sub);
    font-size:13px;
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }
  .row.active .idx{color:var(--accent);}
  .row .idx .eq{display:none;}
  .row.active .idx .num{display:none;}
  .row.active .idx .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;}
  .row.active .idx .eq span{
    width:2.5px;background:var(--accent);display:block;
    animation:eq 0.9s ease-in-out infinite;
  }
  .row.active.paused .idx .eq span{animation-play-state:paused;}
  .row .idx .eq span:nth-child(1){height:60%;animation-delay:0s;}
  .row .idx .eq span:nth-child(2){height:100%;animation-delay:.2s;}
  .row .idx .eq span:nth-child(3){height:40%;animation-delay:.4s;}
  @keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

  .row .thumb{
    width:42px;height:42px;border-radius:4px;object-fit:cover;flex-shrink:0;background:#222;
  }
  .row .info{min-width:0;flex:1;}
  .row .info .t{
    font-size:14.5px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row.active .info .t{color:var(--accent);}
  .row .info .a{
    font-size:12.5px;color:var(--sub);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row .dur{
    font-size:12.5px;color:var(--sub);
    font-variant-numeric:tabular-nums;
    flex-shrink:0;
  }

  /* ---------- Bottom player bar ---------- */
  .playerbar{
    flex-shrink:0;
    border-top:1px solid var(--line);
    background:#0a0a0b;
    padding:12px 24px 16px 24px;
    display:flex;
    align-items:center;
    gap:24px;
  }
  .pb-track{
    display:flex;align-items:center;gap:12px;
    width:220px;flex-shrink:0;
  }
  .pb-track img{width:46px;height:46px;border-radius:4px;object-fit:cover;background:#222;}
  .pb-track .txt{min-width:0;}
  .pb-track .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pb-track .a{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .pb-center{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    max-width:640px;
    margin:0 auto;
  }
  .pb-controls{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .pb-controls button{
    background:none;border:none;color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:.85;
    padding:4px;
  }
  .pb-controls button:hover{opacity:1;}
  .pb-controls svg{width:18px;height:18px;}
  .pb-play{
    background:var(--text) !important;
    border-radius:50%;
    width:34px;height:34px;
    color:#0d0d0f !important;
    opacity:1 !important;
  }
  .pb-play svg{width:16px;height:16px;}
  .toggle-on{color:var(--accent) !important;opacity:1 !important;}
  .toggle-on svg{fill:var(--accent);}

  .pb-progress{
    display:flex;align-items:center;gap:10px;width:100%;
  }
  .pb-time{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;width:36px;flex-shrink:0;}
  .pb-time.right{text-align:right;}
  .bar{
    flex:1;height:4px;background:var(--line);border-radius:2px;
    position:relative;cursor:pointer;
  }
  .bar .fill{
    position:absolute;left:0;top:0;height:100%;background:var(--text);border-radius:2px;
    width:0%;
  }
  .bar:hover .fill{background:var(--accent);}
  .bar .knob{
    position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
    background:var(--text);transform:translate(-50%,-50%);left:0%;
    opacity:0;transition:opacity .1s;
  }
  .bar:hover .knob{opacity:1;}

  .pb-right{
    width:220px;flex-shrink:0;
    display:flex;align-items:center;justify-content:flex-end;gap:10px;
  }
  .pb-right svg{width:16px;height:16px;}
  .vol-bar{width:90px;height:4px;background:var(--line);border-radius:2px;position:relative;cursor:pointer;}
  .vol-bar .fill{position:absolute;left:0;top:0;height:100%;background:var(--text);border-radius:2px;width:70%;}
  .vol-bar:hover .fill{background:var(--accent);}

  /* scrollbars */
  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:#2a2a2d;border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#3a3a3e;}

  @media (max-width: 820px){
    .stage{display:none;}
    .pb-track{width:150px;}
    .pb-right{width:60px;}
    .vol-bar{display:none;}
  }
</style>
</head>
<body>

  <div class="topbar">
    <h1>Ma sélection</h1>
    <span class="count" id="trackCount"></span>
  </div>

  <div class="main">
    <div class="stage">
      <div class="art-wrap"><img id="stageArt" src="" alt=""></div>
      <div class="track-meta">
        <div class="title" id="stageTitle">—</div>
        <div class="artist" id="stageArtist">—</div>
        <div class="album" id="stageAlbum">—</div>
      </div>
    </div>

    <div class="playlist" id="playlist"></div>
  </div>

  <div class="playerbar">
    <div class="pb-track">
      <img id="barArt" src="" alt="">
      <div class="txt">
        <div class="t" id="barTitle">Sélectionne un titre</div>
        <div class="a" id="barArtist">—</div>
      </div>
    </div>

    <div class="pb-center">
      <div class="pb-controls">
        <button id="btnShuffle" title="Lecture aléatoire">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button id="btnPrev" title="Précédent">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path></svg>
        </button>
        <button class="pb-play" id="btnPlay" title="Lecture">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
        </button>
        <button id="btnNext" title="Suivant">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"></path></svg>
        </button>
        <button id="btnRepeat" title="Répéter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          <span id="repeatOneDot" style="display:none;position:absolute;transform:translate(9px,-9px);font-size:8px;font-weight:800;color:var(--accent);">1</span>
        </button>
      </div>
      <div class="pb-progress">
        <span class="pb-time" id="timeCur">0:00</span>
        <div class="bar" id="seekBar"><div class="fill" id="seekFill"></div><div class="knob" id="seekKnob"></div></div>
        <span class="pb-time right" id="timeDur">0:00</span>
      </div>
    </div>

    <div class="pb-right">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06a4.5 4.5 0 0 0 2.5-4.03z"></path></svg>
      <div class="vol-bar" id="volBar"><div class="fill" id="volFill"></div></div>
    </div>
  </div>

<audio id="audio" preload="metadata"></audio>

<script>
const tracks = [
  {file:"music/Avec_Toi_spotdown_org.mp3", cover:"music/covers/Avec_Toi_spotdown_org.jpg", title:"Avec Toi", artist:"OBOY", album:"OMEGA"},
  {file:"music/Jusqu_au_dernier_gramme_spotdown_org.mp3", cover:"music/covers/Jusqu_au_dernier_gramme_spotdown_org.jpg", title:"Jusqu'au dernier gramme", artist:"PNL", album:"Dans la légende"},
  {file:"music/À_tes_côtés_spotdown_org.mp3", cover:"music/covers/À_tes_côtés_spotdown_org.jpg", title:"À tes côtés", artist:"Djadja & Dinaz", album:"À tes côtés"},
  {file:"music/Princesse_de_Babel__SABR__spotdown_org.mp3", cover:"music/covers/Princesse_de_Babel__SABR__spotdown_org.jpg", title:"Princesse de Babel (SABR)", artist:"Zamdane", album:"Unknown Album"},
  {file:"music/Ailleurs_spotdown_org.mp3", cover:"music/covers/Ailleurs_spotdown_org.jpg", title:"Ailleurs", artist:"Josman", album:"J.000.$"},
  {file:"music/La_course_spotdown_org.mp3", cover:"music/covers/La_course_spotdown_org.jpg", title:"La course", artist:"Bouss", album:"Et si j'échoue ??"},
  {file:"music/Daruma_spotdown_org.mp3", cover:"music/covers/Daruma_spotdown_org.jpg", title:"Daruma", artist:"Népal", album:"Adios Bahamas"},
  {file:"music/Cohiba_spotdown_org.mp3", cover:"music/covers/Cohiba_spotdown_org.jpg", title:"Cohiba", artist:"Josman", album:"J.000.$"},
  {file:"music/Amsterdam_spotdown_org.mp3", cover:"music/covers/Amsterdam_spotdown_org.jpg", title:"Amsterdam", artist:"Moha La Squale", album:"Amsterdam"},
  {file:"music/Mi_Amor_spotdown_org.mp3", cover:"music/covers/Mi_Amor_spotdown_org.jpg", title:"Mi Amor", artist:"Hamza", album:"H-24"},
  {file:"music/Rare_spotdown_org.mp3", cover:"music/covers/Rare_spotdown_org.jpg", title:"Rare", artist:"VEN1", album:"Rare"},
  {file:"music/J_béou_spotdown_org.mp3", cover:"music/covers/J_béou_spotdown_org.jpg", title:"J'béou", artist:"Bouss", album:"Et si j'échoue ??"},
  {file:"music/Jeu_spotdown_org.mp3", cover:"music/covers/Jeu_spotdown_org.jpg", title:"Jeu", artist:"Favé", album:"Pleins Phares"},
  {file:"music/JAMAIS_TOI_spotdown_org.mp3", cover:"music/covers/JAMAIS_TOI_spotdown_org.jpg", title:"JAMAIS TOI", artist:"R2", album:"JAMAIS TOI"},
  {file:"music/Vent_de_l_est_spotdown_org.mp3", cover:"music/covers/Vent_de_l_est_spotdown_org.jpg", title:"Vent de l'est", artist:"Laylow", album:".RAW-Z"},
  {file:"music/SAINT-LAURENT_spotdown_org.mp3", cover:"music/covers/SAINT-LAURENT_spotdown_org.jpg", title:"SAINT-LAURENT", artist:"Moji x Sboy", album:"SAINT-LAURENT"},
  {file:"music/ON_THE_MAP_spotdown_org.mp3", cover:"music/covers/ON_THE_MAP_spotdown_org.jpg", title:"ON THE MAP", artist:"T3llz", album:"Unknown Album"},
  {file:"music/Naha_spotdown_org.mp3", cover:"music/covers/Naha_spotdown_org.jpg", title:"Naha", artist:"PNL", album:"Dans la légende"},
  {file:"music/Croire_spotdown_org.mp3", cover:"music/covers/Croire_spotdown_org.jpg", title:"Croire", artist:"Djadja & Dinaz", album:"Drôle de mentalité"},
  {file:"music/Faf_spotdown_org.mp3", cover:"music/covers/Faf_spotdown_org.jpg", title:"Faf", artist:"Werenoi", album:"Pyramide 2"},
  {file:"music/Le_bruit_et_le_silence_spotdown_org.mp3", cover:"music/covers/Le_bruit_et_le_silence_spotdown_org.jpg", title:"Le bruit et le silence", artist:"NeS", album:"Des pieds et des mains"},
  {file:"music/Crossfader_spotdown_org.mp3", cover:"music/covers/Crossfader_spotdown_org.jpg", title:"Crossfader", artist:"Népal", album:"Adios Bahamas"},
  {file:"music/Rose_spotdown_org.mp3", cover:"music/covers/Rose_spotdown_org.jpg", title:"Rose", artist:"Ninho", album:"Comme prévu"},
  {file:"music/HINATA_spotdown_org.mp3", cover:"music/covers/HINATA_spotdown_org.jpg", title:"HINATA", artist:"TIF", album:"1.6"},
  {file:"music/Bambina_spotdown_org.mp3", cover:"music/covers/Bambina_spotdown_org.jpg", title:"Bambina", artist:"PNL", album:"Dans la légende"},
  {file:"music/SUBLIME_spotdown_org.mp3", cover:"music/covers/SUBLIME_spotdown_org.jpg", title:"SUBLIME", artist:"disiz", album:"L'Amour"},
  {file:"music/Bad_Day__SABR__spotdown_org.mp3", cover:"music/covers/Bad_Day__SABR__spotdown_org.jpg", title:"Bad Day (SABR)", artist:"Zamdane", album:"Unknown Album"},
  {file:"music/Ma_dope_spotdown_org.mp3", cover:"music/covers/Ma_dope_spotdown_org.jpg", title:"Ma dope", artist:"Nekfeu, S.Pri Noir", album:"Feu"},
  {file:"music/Luna_spotdown_org.mp3", cover:"music/covers/Luna_spotdown_org.jpg", title:"Luna", artist:"Moha La Squale", album:"Bendero"},
  {file:"music/Elles_ont_trop_joué_avec_mon_coeur_spotdown_org.mp3", cover:"music/covers/Elles_ont_trop_joué_avec_mon_coeur_spotdown_org.jpg", title:"Elles ont trop joué avec mon coeur", artist:"Jok'air", album:"VI République (Version finale)"},
  {file:"music/Prioritaire_spotdown_org.mp3", cover:"music/covers/Prioritaire_spotdown_org.jpg", title:"Prioritaire", artist:"Maes", album:"Les derniers salopards"},
  {file:"music/Jolie__feat__Ninho__spotdown_org.mp3", cover:"music/covers/Jolie__feat__Ninho__spotdown_org.jpg", title:"Jolie (feat. Ninho)", artist:"GAULOIS, Ninho", album:"Jolie (feat. Ninho)"},
  {file:"music/Quand_tout_s_enflamme_spotdown_org.mp3", cover:"music/covers/Quand_tout_s_enflamme_spotdown_org.jpg", title:"Quand tout s'enflamme", artist:"Georgio, PLK", album:"Années Sauvages"},
  {file:"music/Hakayet_spotdown_org.mp3", cover:"music/covers/Hakayet_spotdown_org.jpg", title:"Hakayet", artist:"VEN1", album:"Nichen"},
  {file:"music/Solitaire_spotdown_org.mp3", cover:"music/covers/Solitaire_spotdown_org.jpg", title:"Solitaire", artist:"Werenoi", album:"Telegram"},
  {file:"music/Luz_de_Luna_spotdown_org.mp3", cover:"music/covers/Luz_de_Luna_spotdown_org.jpg", title:"Luz de Luna", artist:"PNL", album:"Dans la légende"}
];

const audio = document.getElementById('audio');
const playlistEl = document.getElementById('playlist');
document.getElementById('trackCount').textContent = tracks.length + ' titres';

let current = 0;
let isPlaying = false;
let shuffle = false;
let repeatMode = 0; // 0 off, 1 all, 2 one
let shuffleOrder = [];

function fmt(s){
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

function buildShuffleOrder(){
  shuffleOrder = tracks.map((_,i)=>i);
  for(let i = shuffleOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffleOrder[i],shuffleOrder[j]] = [shuffleOrder[j],shuffleOrder[i]];
  }
}
buildShuffleOrder();

function renderPlaylist(){
  playlistEl.innerHTML = '';
  tracks.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.idx = i;
    row.innerHTML = `
      <div class="idx"><span class="num">${i+1}</span><span class="eq"><span></span><span></span><span></span></span></div>
      <img class="thumb" src="${t.cover}" alt="">
      <div class="info">
        <div class="t">${t.title}</div>
        <div class="a">${t.artist}</div>
      </div>
      <div class="dur" data-dur></div>
    `;
    row.addEventListener('click', ()=> loadTrack(i, true));
    playlistEl.appendChild(row);
  });
}
renderPlaylist();

function updateActiveRow(){
  document.querySelectorAll('.row').forEach(r=>{
    const idx = parseInt(r.dataset.idx);
    r.classList.toggle('active', idx === current);
    r.classList.toggle('paused', idx === current && !isPlaying);
  });
}

function loadTrack(i, autoplay){
  current = i;
  const t = tracks[i];
  audio.src = t.file;

  document.getElementById('stageArt').src = t.cover;
  document.getElementById('stageTitle').textContent = t.title;
  document.getElementById('stageArtist').textContent = t.artist;
  document.getElementById('stageAlbum').textContent = t.album;

  document.getElementById('barArt').src = t.cover;
  document.getElementById('barTitle').textContent = t.title;
  document.getElementById('barArtist').textContent = t.artist;

  updateActiveRow();

  if(autoplay){
    audio.play().then(()=>{ isPlaying = true; syncPlayIcon(); updateActiveRow(); }).catch(()=>{});
  }
}

function syncPlayIcon(){
  const icon = document.getElementById('playIcon');
  icon.innerHTML = isPlaying
    ? '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>'
    : '<path d="M8 5v14l11-7z"></path>';
}

document.getElementById('btnPlay').addEventListener('click', ()=>{
  if(!audio.src){ loadTrack(0, true); return; }
  if(isPlaying){ audio.pause(); isPlaying=false; }
  else { audio.play(); isPlaying=true; }
  syncPlayIcon();
  updateActiveRow();
});

function nextTrack(userTriggered){
  if(repeatMode === 2 && !userTriggered){
    audio.currentTime = 0; audio.play(); return;
  }
  let idx;
  if(shuffle){
    const pos = shuffleOrder.indexOf(current);
    if(pos === shuffleOrder.length-1){
      if(repeatMode === 0 && !userTriggered){ isPlaying=false; syncPlayIcon(); updateActiveRow(); return; }
      buildShuffleOrder();
      idx = shuffleOrder[0];
    } else {
      idx = shuffleOrder[pos+1];
    }
  } else {
    if(current === tracks.length-1){
      if(repeatMode === 0 && !userTriggered){ isPlaying=false; syncPlayIcon(); updateActiveRow(); return; }
      idx = 0;
    } else {
      idx = current+1;
    }
  }
  loadTrack(idx, true);
}

function prevTrack(){
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  let idx;
  if(shuffle){
    const pos = shuffleOrder.indexOf(current);
    idx = pos === 0 ? shuffleOrder[shuffleOrder.length-1] : shuffleOrder[pos-1];
  } else {
    idx = current === 0 ? tracks.length-1 : current-1;
  }
  loadTrack(idx, true);
}

document.getElementById('btnNext').addEventListener('click', ()=> nextTrack(true));
document.getElementById('btnPrev').addEventListener('click', prevTrack);

document.getElementById('btnShuffle').addEventListener('click', function(){
  shuffle = !shuffle;
  this.classList.toggle('toggle-on', shuffle);
  if(shuffle) buildShuffleOrder();
});

const repeatBtn = document.getElementById('btnRepeat');
repeatBtn.style.position = 'relative';
repeatBtn.addEventListener('click', function(){
  repeatMode = (repeatMode+1)%3;
  this.classList.toggle('toggle-on', repeatMode !== 0);
  document.getElementById('repeatOneDot').style.display = repeatMode === 2 ? 'block':'none';
});

audio.addEventListener('ended', ()=> nextTrack(false));

audio.addEventListener('timeupdate', ()=>{
  const pct = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
  document.getElementById('seekFill').style.width = pct+'%';
  document.getElementById('seekKnob').style.left = pct+'%';
  document.getElementById('timeCur').textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', ()=>{
  document.getElementById('timeDur').textContent = fmt(audio.duration);
  const row = document.querySelector(`.row[data-idx="${current}"] [data-dur]`);
  if(row) row.textContent = fmt(audio.duration);
});

const seekBar = document.getElementById('seekBar');
seekBar.addEventListener('click', (e)=>{
  const rect = seekBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left)/rect.width;
  if(audio.duration) audio.currentTime = pct*audio.duration;
});

const volBar = document.getElementById('volBar');
const volFill = document.getElementById('volFill');
audio.volume = 0.7;
function setVol(e){
  const rect = volBar.getBoundingClientRect();
  let pct = (e.clientX - rect.left)/rect.width;
  pct = Math.max(0, Math.min(1,pct));
  audio.volume = pct;
  volFill.style.width = (pct*100)+'%';
}
volBar.addEventListener('click', setVol);
let draggingVol = false;
volBar.addEventListener('mousedown', ()=>{draggingVol=true;});
window.addEventListener('mouseup', ()=>{draggingVol=false;});
window.addEventListener('mousemove', (e)=>{ if(draggingVol) setVol(e); });

// preload durations for playlist rows
tracks.forEach((t,i)=>{
  const a = new Audio();
  a.preload = 'metadata';
  a.src = t.file;
  a.addEventListener('loadedmetadata', ()=>{
    const row = document.querySelector(`.row[data-idx="${i}"] [data-dur]`);
    if(row) row.textContent = fmt(a.duration);
  });
});

// keyboard shortcuts
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space' && e.target.tagName !== 'INPUT'){
    e.preventDefault();
    document.getElementById('btnPlay').click();
  }
});

// init
loadTrack(0, false);
</script>
</body>
</html>
